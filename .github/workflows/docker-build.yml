name: Docker Build and Push

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        base_tag: [1.18.0,1.18.0-rolling-weekly,1.18.0-rolling-daily]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GITHUB_ACTOR }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./citrix-workspace
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/citrix-workspace:${{ matrix.base_tag }}
          build-args: |
            BASE_IMAGE=core-ubuntu-noble
            BASE_TAG=${{ matrix.base_tag }}